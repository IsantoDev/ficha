name: Alertas de suplemento

on:
  schedule:
    # a cada 15 min, das 07:00 às 21:59 de Brasília (UTC-3)
    - cron: "*/15 10-23,0 * * *"
  workflow_dispatch:

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lembrete.sh
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
